name: Bug Report
description: Báo cáo lỗi bạn gặp phải trong quá trình sử dụng
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Cảm ơn bạn đã dành thời gian báo cáo lỗi!
  - type: textarea
    id: description
    attributes:
      label: Mô tả lỗi
      description: Mô tả rõ ràng và ngắn gọn về sự cố.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Các bước tái hiện lỗi
      description: Liệt kê các bước cụ thể để tái hiện lỗi.
      placeholder: |
        1. Mở trang bản đồ
        2. Nhấp chọn phòng A
        3. Chọn điều hướng đến phòng B
        4. Thấy lỗi xuất hiện...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Môi trường (Trình duyệt, Hệ điều hành)
      placeholder: Chrome 120, Windows 11
    validations:
      required: false
